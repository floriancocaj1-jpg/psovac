<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brojač psovki</title>
<style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#1d1b18;--mute:#7a746b;--line:#e4ded4;--a:#e4572e;--b:#2e86de;--win:#fff3c4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17160f;--card:#242219;--ink:#f1ede4;--mute:#a39c8d;--line:#38352a;--a:#ff7a55;--b:#5aa6ff;--win:#4a4116}}
:root[data-theme="dark"]{--bg:#17160f;--card:#242219;--ink:#f1ede4;--mute:#a39c8d;--line:#38352a;--a:#ff7a55;--b:#5aa6ff;--win:#4a4116}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 14px;letter-spacing:-.3px}
.score{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.p{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 12px;text-align:center}
.p.me{border-color:currentColor}
.p.a{color:var(--a)}.p.b{color:var(--b)}
.p input{width:100%;border:0;background:transparent;color:var(--ink);font:600 14px inherit;text-align:center;outline:none}
.p .t{font-size:40px;font-weight:800;line-height:1.1}
.p small{color:var(--mute);font-size:12px}
.who{display:flex;gap:8px;align-items:center;margin:0 0 14px;font-size:14px;color:var(--mute)}
.who button{flex:1;padding:9px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:600 14px inherit;cursor:pointer}
.who button.on.a{border-color:var(--a);background:color-mix(in srgb,var(--a) 15%,var(--card))}
.who button.on.b{border-color:var(--b);background:color-mix(in srgb,var(--b) 15%,var(--card))}
.add{display:flex;gap:8px;margin-bottom:16px}
.add input{flex:1;min-width:0;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:16px inherit}
.add button{padding:0 18px;border-radius:12px;border:0;background:var(--ink);color:var(--bg);font:700 15px inherit;cursor:pointer}
.w{display:flex;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden}
.tap{flex:1;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px;border:0;background:transparent;color:var(--ink);font:inherit;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
.tap:active{background:var(--win)}
.name{font-size:20px;font-weight:700;word-break:break-word}
.n{display:flex;gap:14px;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.n span:first-child{color:var(--a)}.n span:last-child{color:var(--b)}
.n .lead{text-decoration:underline;text-underline-offset:4px}
.side{display:flex;flex-direction:column;border-left:1px solid var(--line)}
.side button{flex:1;width:44px;border:0;background:transparent;color:var(--mute);font-size:16px;cursor:pointer}
.side button+button{border-top:1px solid var(--line)}
.empty,.msg{text-align:center;color:var(--mute);padding:28px 8px}
</style>
</head>
<body>
<main>
<h1>🤬 Tko više psuje?</h1>
<div id="app"><div class="msg">Učitavam…</div></div>
</main>
<script>
(async function(){
const app=document.getElementById('app');
const claude_=window.claude;
let db=null;
try{db=claude_?await claude_.use('db'):null}catch(e){db=null}
if(!db){app.innerHTML='<div class="msg">Aplikacija treba prijavu u Claude da bi spremala podatke. Otvori link dok si prijavljen.</div>';return}

let words=[],counts={},players={a:'Ja',b:'Brat'},me='a';
try{me=localStorage.getItem('me')==='b'?'b':'a'}catch(e){}
const local={},dirty={},busy={};

const wCol=db.collection('words'),cCol=db.collection('counts'),pDoc=db.doc('meta/players');

app.innerHTML='<div class="score" id="score"></div><div class="who" id="who"></div>'+
'<div class="add"><input id="inp" placeholder="Nova psovka…" maxlength="40" autocomplete="off"><button id="addBtn">Dodaj</button></div><div id="list"></div>';
const $=id=>document.getElementById(id);

function val(wid,s){const k=wid+'_'+s;return (k in local && (dirty[k]||busy[k]))?local[k]:(counts[k]||0)}
function total(s){return words.reduce((t,w)=>t+val(w.id,s),0)}

function renderTop(){
  const sc=$('score'),foc=document.activeElement;
  ['a','b'].forEach(s=>{
    let el=sc.querySelector('.p.'+s);
    if(!el){el=document.createElement('div');el.className='p '+s;
      el.innerHTML='<input maxlength="14"><div class="t"></div><small>psovki</small>';
      const inp=el.querySelector('input');
      inp.addEventListener('change',()=>{const v=inp.value.trim().slice(0,14)||(s==='a'?'Ja':'Brat');players[s]=v;
        pDoc.set({a:players.a,b:players.b}).catch(()=>{})});
      sc.appendChild(el)}
    el.classList.toggle('me',me===s);
    const inp=el.querySelector('input');if(foc!==inp)inp.value=players[s];
    el.querySelector('.t').textContent=total(s);
  });
  const who=$('who');who.textContent='';
  const lab=document.createElement('span');lab.textContent='Ja sam:';who.appendChild(lab);
  ['a','b'].forEach(s=>{const b=document.createElement('button');b.className=s+(me===s?' on':'');b.textContent=players[s];
    b.onclick=()=>{me=s;try{localStorage.setItem('me',s)}catch(e){}render()};who.appendChild(b)});
}

function renderList(){
  const list=$('list');list.textContent='';
  if(!words.length){const d=document.createElement('div');d.className='empty';d.textContent='Još nema psovki. Dodaj prvu gore i počnite brojati.';list.appendChild(d);return}
  const sorted=[...words].sort((x,y)=>(val(y.id,'a')+val(y.id,'b'))-(val(x.id,'a')+val(x.id,'b'))||String(x.text).localeCompare(String(y.text)));
  sorted.forEach(w=>{
    const a=val(w.id,'a'),b=val(w.id,'b');
    const row=document.createElement('div');row.className='w';
    const tap=document.createElement('button');tap.className='tap';
    const nm=document.createElement('span');nm.className='name';nm.textContent=w.text;
    const n=document.createElement('span');n.className='n';
    const sa=document.createElement('span'),sb=document.createElement('span');
    sa.textContent=a;sb.textContent=b;if(a>b)sa.className='lead';if(b>a)sb.className='lead';
    n.append(sa,sb);tap.append(nm,n);tap.onclick=()=>bump(w,1);
    const side=document.createElement('div');side.className='side';
    const minus=document.createElement('button');minus.textContent='−';minus.title='Oduzmi';minus.onclick=()=>bump(w,-1);
    const del=document.createElement('button');del.textContent='✕';del.title='Obriši psovku';del.onclick=()=>removeWord(w);
    side.append(minus,del);row.append(tap,side);list.appendChild(row);
  });
}
function render(){renderTop();renderList()}

function bump(w,d){
  const k=w.id+'_'+me,cur=val(w.id,me);
  const nv=Math.max(0,cur+d);if(nv===cur)return;
  local[k]=nv;dirty[k]=true;render();flush(w,k,me);
}
async function flush(w,k,s){
  if(busy[k])return;busy[k]=true;
  try{while(dirty[k]){dirty[k]=false;
    try{await cCol.doc(k).set({word:w.id,slot:s,n:local[k]})}catch(e){dirty[k]=false;delete local[k];break}}}
  finally{busy[k]=false;render()}
}
async function removeWord(w){
  if(!confirm('Obrisati „'+w.text+'“ i njezine brojeve?'))return;
  try{await Promise.all([wCol.doc(w.id).delete(),cCol.doc(w.id+'_a').delete(),cCol.doc(w.id+'_b').delete()])}catch(e){}
}
async function addWord(){
  const inp=$('inp');const t=inp.value.trim().slice(0,40);if(!t)return;
  if(words.some(w=>String(w.text).toLowerCase()===t.toLowerCase())){inp.value='';return}
  inp.value='';
  try{await wCol.add({text:t,at:Date.now()})}catch(e){inp.value=t}
}
$('addBtn').onclick=addWord;
$('inp').addEventListener('keydown',e=>{if(e.key==='Enter')addWord()});

wCol.onSnapshot(s=>{words=s.docs.map(d=>({id:d.id,text:d.data().text||'?'}));render()},()=>{});
cCol.onSnapshot(s=>{counts={};s.docs.forEach(d=>{counts[d.id]=Number(d.data().n)||0});render()},()=>{});
pDoc.onSnapshot(s=>{if(s.exists){const d=s.data();players={a:d.a||'Ja',b:d.b||'Brat'}}render()},()=>{});
render();
})();
</script>
</body>
</html>
